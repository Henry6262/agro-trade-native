name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sonar-backend:
    name: SonarCloud — Backend
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for SonarCloud blame data

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix "$GITHUB_WORKSPACE/backend"

      - name: Run tests with coverage
        run: npm run test:cov -- --ci --runInBand --coverageThreshold='{}'
        env:
          NODE_ENV: test

      - name: SonarCloud Scan — Backend
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note missing SonarCloud configuration
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SonarCloud scan skipped because SONAR_TOKEN_BACKEND is not configured."

  sonar-frontend:
    name: SonarCloud — Frontend
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage --workspace front-end -- --ci --runInBand
        env:
          NODE_ENV: test

      - name: SonarCloud Scan — Frontend
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: front-end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note missing SonarCloud configuration
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SonarCloud scan skipped because SONAR_TOKEN_FRONTEND is not configured."
