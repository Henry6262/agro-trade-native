name: Codecov Coverage Upload

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix "$GITHUB_WORKSPACE/backend"

      - name: Run tests with coverage
        run: npm run test:cov -- --ci --runInBand --coverageThreshold='{}'
        env:
          NODE_ENV: test

      - name: Upload backend coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./backend/coverage/unit/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: true

      - name: Note missing Codecov configuration
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "Codecov upload skipped because CODECOV_TOKEN is not configured."

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage --workspace front-end -- --ci --runInBand
        env:
          NODE_ENV: test

      - name: Upload frontend coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./front-end/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: true

      - name: Note missing Codecov configuration
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: echo "Codecov upload skipped because CODECOV_TOKEN is not configured."
